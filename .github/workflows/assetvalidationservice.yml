name: AssetValidationService

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "AssetValidationServiceV2/**"
      - ".github/workflows/assetvalidationservice.yml"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.18"
          cache-dependency-path: AssetValidationServiceV2/go.sum
      - run: go build ./...
        working-directory: AssetValidationServiceV2
