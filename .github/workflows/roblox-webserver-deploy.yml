name: Roblox Webserver Deploy

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "Roblox/**"
      - ".github/workflows/roblox-webserver-deploy.yml"
      - "scripts/windows/**"

concurrency:
  group: roblox-webserver-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore Roblox\Roblox.sln

      - name: Build deployable projects
        run: |
          dotnet build Roblox\Roblox.Website\Roblox.Website.csproj -c Release --no-restore -m:1
          dotnet build Roblox\Roblox.ApiProxy\Roblox.ApiProxy.csproj -c Release --no-restore -m:1
          dotnet build Roblox\Services\Roblox.Services.DataStore\Roblox.Services.DataStore.csproj -c Release --no-restore -m:1
          dotnet build Roblox\Services\Roblox.Services.Moderation\Roblox.Services.Moderation.csproj -c Release --no-restore -m:1
          dotnet build Roblox\Services\Roblox.Services.Donation\Roblox.Services.Donation.csproj -c Release --no-restore -m:1

      - name: Publish deployable projects
        run: |
          $bundleRoot = Join-Path $env:GITHUB_WORKSPACE "deploy_bundle"
          Remove-Item $bundleRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $bundleRoot | Out-Null

          dotnet publish Roblox\Roblox.Website\Roblox.Website.csproj -c Release --no-build -o (Join-Path $bundleRoot "Roblox.Website")
          dotnet publish Roblox\Roblox.ApiProxy\Roblox.ApiProxy.csproj -c Release --no-build -o (Join-Path $bundleRoot "Roblox.ApiProxy")
          dotnet publish Roblox\Services\Roblox.Services.DataStore\Roblox.Services.DataStore.csproj -c Release --no-build -o (Join-Path $bundleRoot "Roblox.Services.DataStore")
          dotnet publish Roblox\Services\Roblox.Services.Moderation\Roblox.Services.Moderation.csproj -c Release --no-build -o (Join-Path $bundleRoot "Roblox.Services.Moderation")
          dotnet publish Roblox\Services\Roblox.Services.Donation\Roblox.Services.Donation.csproj -c Release --no-build -o (Join-Path $bundleRoot "Roblox.Services.Donation")

      - name: Add deployment scripts
        run: |
          $scriptTarget = Join-Path $env:GITHUB_WORKSPACE "deploy_bundle\scripts\windows"
          New-Item -ItemType Directory -Force -Path $scriptTarget | Out-Null
          Copy-Item scripts\windows\Deploy-Roblox-WebServices.ps1 $scriptTarget -Force

      - name: Upload deploy bundle
        uses: actions/upload-artifact@v4
        with:
          name: roblox-webserver-deploy-bundle
          path: deploy_bundle
          retention-days: 7

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    env:
      WEB_SERVER_PORT: ${{ secrets.WEB_SERVER_PORT || '22' }}
      DEPLOY_ROOT: ${{ vars.WEB_DEPLOY_ROOT || 'C:\KoroneServices' }}
      STAGING_ROOT: ${{ vars.WEB_STAGING_ROOT || 'korone-deploy' }}
      APIPROXY_SERVICE: ${{ vars.WEB_APIPROXY_SERVICE || 'Roblox.ApiProxy' }}
      WEBSITE_SERVICE: ${{ vars.WEB_WEBSITE_SERVICE || 'Roblox.Website' }}
      DATASTORE_SERVICE: ${{ vars.WEB_DATASTORE_SERVICE || 'Roblox.Services.DataStore' }}
      MODERATION_SERVICE: ${{ vars.WEB_MODERATION_SERVICE || 'Roblox.Services.Moderation' }}
      DONATION_SERVICE: ${{ vars.WEB_DONATION_SERVICE || 'Roblox.Services.Donation' }}
    steps:
      - name: Download deploy bundle
        uses: actions/download-artifact@v4
        with:
          name: roblox-webserver-deploy-bundle
          path: deploy_bundle

      - name: Prepare SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' '${{ secrets.WEB_SERVER_SSH_KEY }}' > ~/.ssh/korone_deploy_key
          chmod 600 ~/.ssh/korone_deploy_key

      - name: Archive deploy bundle
        run: |
          tar -czf roblox-webserver-deploy-bundle.tar.gz -C deploy_bundle .

      - name: Create remote staging directory
        run: |
          remote_script=$(cat <<'EOF'
          $stagingRoot = Join-Path $env:USERPROFILE '${{ env.STAGING_ROOT }}\${{ github.run_id }}'
          New-Item -ItemType Directory -Force -Path $stagingRoot | Out-Null
          EOF
          )
          encoded=$(printf '%s' "$remote_script" | iconv -f UTF-8 -t UTF-16LE | base64 -w 0)
          ssh -i ~/.ssh/korone_deploy_key -o StrictHostKeyChecking=no -p "${{ env.WEB_SERVER_PORT }}" "${{ secrets.WEB_SERVER_USER }}@${{ secrets.WEB_SERVER_HOST }}" "cmd /c powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand $encoded"

      - name: Upload deploy bundle
        run: >
          scp -i ~/.ssh/korone_deploy_key
          -O
          -o StrictHostKeyChecking=no
          -P "${{ env.WEB_SERVER_PORT }}"
          roblox-webserver-deploy-bundle.tar.gz
          "${{ secrets.WEB_SERVER_USER }}@${{ secrets.WEB_SERVER_HOST }}:${{ env.STAGING_ROOT }}/${{ github.run_id }}/roblox-webserver-deploy-bundle.tar.gz"

      - name: Deploy and restart services
        run: |
          remote_script=$(cat <<'EOF'
          $stagingRoot = Join-Path $env:USERPROFILE '${{ env.STAGING_ROOT }}\${{ github.run_id }}'
          tar -xf (Join-Path $stagingRoot 'roblox-webserver-deploy-bundle.tar.gz') -C $stagingRoot
          & (Join-Path $stagingRoot 'scripts\windows\Deploy-Roblox-WebServices.ps1') `
            -SourceRoot $stagingRoot `
            -DeployRoot '${{ env.DEPLOY_ROOT }}' `
            -ApiProxyServiceName '${{ env.APIPROXY_SERVICE }}' `
            -WebsiteServiceName '${{ env.WEBSITE_SERVICE }}' `
            -DataStoreServiceName '${{ env.DATASTORE_SERVICE }}' `
            -ModerationServiceName '${{ env.MODERATION_SERVICE }}' `
            -DonationServiceName '${{ env.DONATION_SERVICE }}'
          EOF
          )
          encoded=$(printf '%s' "$remote_script" | iconv -f UTF-8 -t UTF-16LE | base64 -w 0)
          ssh -i ~/.ssh/korone_deploy_key -o StrictHostKeyChecking=no -p "${{ env.WEB_SERVER_PORT }}" "${{ secrets.WEB_SERVER_USER }}@${{ secrets.WEB_SERVER_HOST }}" "cmd /c powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand $encoded"
